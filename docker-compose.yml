services:

  backend:

    build:
      context: ./backend

    container_name: backend

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: production

    volumes:
      - h2-data:/app/data

    networks:
      - web-network

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - web-network

networks:
  web-network:

volumes:
  h2-data: